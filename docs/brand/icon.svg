    <clipPath id="l"><polygon points="0,0 17,0 9,32 0,32"/></clipPath>
    <clipPath id="r"><polygon points="23,0 32,0 32,32 15,32"/></clipPath>
  </defs>
  <polygon points="6,0 32,0 32,26 26,32 0,32 0,6" fill="#0a0e24"/>
  <polygon points="6.2,0.5 31.5,0.5 31.5,25.8 25.8,31.5 0.5,31.5 0.5,6.2" fill="none" stroke="#2b3766" stroke-width="1"/>
  <g clip-path="url(#l)"><polygon points="16,8.5 23.5,16 16,23.5 8.5,16" fill="none" stroke="#7ff0ff" stroke-width="2.6"/></g>
  <g transform="translate(1.3 -1.8)"><g clip-path="url(#r)"><polygon points="16,8.5 23.5,16 16,23.5 8.5,16" fill="none" stroke="#7ff0ff" stroke-width="2.6"/></g></g>
