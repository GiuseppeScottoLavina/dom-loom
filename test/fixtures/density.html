<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Growing a Holo stage</title>
  <link rel="stylesheet" href="/src/loom.css">
  <script type="module" src="/src/index.js"></script>
  <style>
    body { margin: 8px; background: #101626; }
    #panel { width: 640px; }
    #panel .loom-source { display: grid; grid-template-columns: repeat(8, 80px); grid-auto-rows: 32px; padding: 0; border: 0; }
    #panel input { box-sizing: border-box; width: 72px; height: 24px; place-self: center; margin: 0; }
  </style>
</head>
<body>
  <loom-stage id="panel"><input type="range" aria-label="First"></loom-stage>
</body>
</html>
