<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass: a pane over stripes</title>
  <link rel="stylesheet" href="/src/base.css">
  <link rel="stylesheet" href="/src/skins/glass/glass.css">
  <style>
    body { margin: 0; background: #fff; }
    loom-stage { display: block; width: 600px; margin: 20px; }
    .stripes { position: relative; height: 300px; background: repeating-linear-gradient(90deg, #000 0 6px, #fff 6px 12px); }
    /* No milk, no blur: the bend alone, measurable. */
    #pane { position: absolute; left: 150px; top: 100px; width: 300px; height: 100px; border-radius: 20px; background: none; backdrop-filter: none; }
  </style>
  <script type="module">
    import '/src/index.js';
    import '/src/skins/glass/index.js';
  </script>
</head>
<body>
  <loom-stage id="g" skin="glass">
    <div class="stripes"><div id="pane" glass></div></div>
  </loom-stage>
</body>
</html>
