# Checks every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run build

  # The browser suite on Chrome with a software WebGPU (SwiftShader). Experimental:
  # it has not run on GitHub yet, so it does not block; the suite runs locally on a GPU.
  browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: xvfb-run --auto-servernum npm run test:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_ARGS: --use-webgpu-adapter=swiftshader --enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader --disable-vulkan-surface
      - run: xvfb-run --auto-servernum npm run test:app
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_ARGS: --use-webgpu-adapter=swiftshader --enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader --disable-vulkan-surface
      - run: xvfb-run --auto-servernum npm run test:dialog
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_ARGS: --use-webgpu-adapter=swiftshader --enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader --disable-vulkan-surface
      # Here the "hardware" pass already runs on SwiftShader (CHROME_ARGS).
      - run: xvfb-run --auto-servernum npm run test:startup -- --gpu=hardware
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_ARGS: --use-webgpu-adapter=swiftshader --enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader --disable-vulkan-surface
