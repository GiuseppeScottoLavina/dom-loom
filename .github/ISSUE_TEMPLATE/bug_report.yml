name: Bug report
description: Something does not draw, move or respond as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: markup
    attributes:
      label: The smallest markup that shows it
      description: A `<loom-stage>` with the few elements needed, and any script that drives it.
      render: html
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 157 on macOS 26, Safari on iPadOS 27…
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Render path
      description: The stage's data-renderer and data-mode attributes.
      options:
        - webgpu / native
        - webgpu / native-bridged
        - webgpu / polyfill
        - dom (no WebGPU)
        - I don't know
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DomLoom version
